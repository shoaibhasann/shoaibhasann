name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"      # ~06:17 UTC daily
  workflow_dispatch: {}         # run on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install needed: fetch + render are stdlib-only.
      - name: Refresh contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Re-render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
